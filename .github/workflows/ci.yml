name: Validate skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install pinned validation and image tools
        run: |
          python -m pip install -r skills/web-rebuild/scripts/requirements.txt
          python -m pip install click==8.1.8 strictyaml==1.7.3 playwright==1.62.0
          python -m pip install --no-deps 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Validate Agent Skills specification and package links
        run: |
          skills-ref validate skills/web-rebuild
          python tests/validate_repo.py
      - name: Run deterministic image helper tests
        run: python -m unittest discover -s tests -v
      - name: Capture synthetic reference and test comparison pipeline
        run: |
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
      - name: Verify URL inspection and comparison controls
        env:
          CHECK_PUBLIC_REFERENCE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '1' || '0' }}
        run: python tests/url_smoke.py
      - name: Build and test static showcase
        run: |
          python tests/build_site.py
          python tests/site_smoke.py
      - name: Preserve synthetic verification artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: synthetic-capture-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Smoke test skill discovery and agent installations
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        shell: bash
        run: |
          npx --yes skills@1.5.23 add "$GITHUB_WORKSPACE" --list
          for agent in opencode claude-code cursor codex; do
            target="$(mktemp -d)"
            (
              cd "$target"
              npx --yes skills@1.5.23 add "$GITHUB_WORKSPACE" --skill web-rebuild --agent "$agent" --copy --yes
              npx --yes skills@1.5.23 list
              test -n "$(find . -path '*/web-rebuild/SKILL.md' -print -quit)"
              test -n "$(find . -path '*/web-rebuild/scripts/compare_images.py' -print -quit)"
              test -n "$(find . -path '*/web-rebuild/references/verification.md' -print -quit)"
            )
          done
      - name: Smoke test public GitHub installation
        if: github.event_name != 'pull_request'
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        shell: bash
        run: |
          target="$(mktemp -d)"
          cd "$target"
          npx --yes skills@1.5.23 add MhmmdFaizal04/web-rebuild-skills --skill web-rebuild --agent opencode --copy --yes
          test -n "$(find . -path '*/web-rebuild/SKILL.md' -print -quit)"
      - name: Upload verified public Pages files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified showcase
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
