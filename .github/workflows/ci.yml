name: Validate skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned validation and image tools
        run: |
          python -m pip install -r skills/web-rebuild/scripts/requirements.txt
          python -m pip install click==8.1.8 strictyaml==1.7.3 playwright==1.62.0
          python -m pip install --no-deps 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Validate Agent Skills specification and package links
        run: |
          skills-ref validate skills/web-rebuild
          python tests/validate_repo.py
      - name: Run deterministic image helper tests
        run: python -m unittest discover -s tests -v
      - name: Capture synthetic reference and test comparison pipeline
        run: |
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
      - name: Preserve synthetic verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-capture-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Smoke test skill discovery and agent installations
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        shell: bash
        run: |
          npx --yes skills@1.5.23 add "$GITHUB_WORKSPACE" --list
          for agent in opencode claude-code cursor codex; do
            target="$(mktemp -d)"
            (
              cd "$target"
              npx --yes skills@1.5.23 add "$GITHUB_WORKSPACE" --skill web-rebuild --agent "$agent" --copy --yes
              npx --yes skills@1.5.23 list
              test -n "$(find . -path '*/web-rebuild/SKILL.md' -print -quit)"
              test -n "$(find . -path '*/web-rebuild/scripts/compare_images.py' -print -quit)"
              test -n "$(find . -path '*/web-rebuild/references/verification.md' -print -quit)"
            )
          done
      - name: Smoke test public GitHub installation
        if: github.event_name != 'pull_request'
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        shell: bash
        run: |
          target="$(mktemp -d)"
          cd "$target"
          npx --yes skills@1.5.23 add MhmmdFaizal04/web-rebuild-skills --skill web-rebuild --agent opencode --copy --yes
          test -n "$(find . -path '*/web-rebuild/SKILL.md' -print -quit)"
